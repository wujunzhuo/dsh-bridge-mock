<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DeepSeek Harness · 对话</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f8fafc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #697586;
      --line: #e2e8f0;
      --panel: #ffffff;
      --accent: #b7e4c7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, textarea { font: inherit; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    header { height: 76px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 650; letter-spacing: .01em; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; color: #1b4332; background: var(--accent); border-radius: 11px; font-size: 19px; }
    .brand small { display: block; margin-top: 3px; color: var(--muted); font-weight: 450; font-size: 11px; letter-spacing: .04em; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .status { color: var(--muted); font-size: 12px; }
    .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #777985; }
    .status.ready::before { background: var(--accent); }
    button { border: 1px solid var(--line); color: #344054; background: #fff; border-radius: 9px; padding: 9px 13px; cursor: pointer; transition: .15s ease; }
    button:hover { border-color: #b8c2cf; background: #f1f5f9; }
    button:disabled { opacity: .55; cursor: wait; }
    main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 780px; margin: 0 auto; }
    .intro { text-align: center; padding: clamp(44px, 10vh, 100px) 0 34px; }
    .intro .spark { font-size: 28px; color: var(--accent); }
    h1 { margin: 13px 0 9px; font-size: clamp(25px, 4vw, 34px); font-weight: 620; letter-spacing: -.035em; }
    .intro p { margin: 0; color: var(--muted); font-size: 14px; }
    #messages { flex: 1; padding: 4px 0 24px; }
    .message { display: flex; gap: 13px; margin: 22px 0; align-items: flex-start; animation: enter .18s ease-out; }
    @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .avatar { flex: 0 0 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; background: #e9eef5; color: #526174; font-size: 13px; }
    .message.assistant .avatar { color: #1b4332; background: var(--accent); }
    .message-body { min-width: 0; flex: 1; padding-top: 3px; }
    .role { color: #778395; font-size: 11px; margin-bottom: 7px; }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; font-size: 14px; }
    .message.user .content { color: #263244; }
    .message.error .content { color: #b42318; }
    .meta { margin-top: 9px; color: #778395; font-size: 10px; }
    .activity-list { display: grid; gap: 8px; margin: 3px 0 10px; }
    .reasoning-card, .tool-card { border: 1px solid #dce3ea; border-radius: 9px; background: #fff; color: #475467; font-size: 12px; }
    .reasoning-card summary, .tool-card summary { cursor: pointer; padding: 9px 11px; color: #475467; }
    .reasoning-card[open] summary, .tool-card[open] summary { border-bottom: 1px solid #e2e8f0; }
    .event-body { padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; color: #526174; }
    .event-body + .event-body { border-top: 1px solid #e2e8f0; }
    .tool-state { color: var(--muted); }
    .tool-state.error { color: #b42318; }
    .thinking { display: inline-flex; gap: 5px; padding: 9px 0; }
    .thinking i { width: 5px; height: 5px; border-radius: 50%; background: #5b9b70; opacity: .45; animation: pulse 1s ease-in-out infinite; }
    .thinking i:nth-child(2) { animation-delay: .15s; }
    .thinking i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 50% { opacity: 1; transform: translateY(-3px); } }
    .composer-wrap { position: sticky; bottom: 0; padding: 12px 0 20px; background: linear-gradient(transparent, #f8fafc 16%); }
    .composer { border: 1px solid #d3dae3; background: var(--panel); border-radius: 15px; padding: 12px 13px 10px 16px; box-shadow: 0 14px 40px #33415514; }
    textarea { display: block; width: 100%; min-height: 52px; max-height: 190px; resize: none; border: 0; outline: 0; color: #1f2937; background: transparent; line-height: 1.55; font-size: 14px; }
    textarea::placeholder { color: #8b95a1; }
    .composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hint { color: #778395; font-size: 10px; }
    .send { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); border-color: #a5d6b7; color: #1b4332; padding: 8px 12px; font-size: 12px; font-weight: 650; }
    .send:hover { background: #a5d6b7; border-color: #91cba5; }
    .send:disabled { color: #1b4332; }
    .cancel { color: #b42318; border-color: #f0b8b2; background: #fff; }
    .cancel:hover { color: #912018; border-color: #d98c84; background: #fff7f6; }
    .cancel[hidden] { display: none; }
    footer { padding: 0 0 15px; text-align: center; color: #7a8593; font-size: 10px; }
    dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 1px solid #d5dde6; border-radius: 14px; color: #1f2937; background: #fff; box-shadow: 0 24px 90px #33415533; }
    dialog::backdrop { background: #1f293766; backdrop-filter: blur(4px); }
    .dialog-inner { padding: 22px; }
    .dialog-inner h2 { margin: 0 0 8px; font-size: 17px; }
    .dialog-inner p { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .dialog-inner label { display: block; margin-bottom: 7px; color: #475467; font-size: 12px; }
    .dialog-inner input { width: 100%; padding: 11px 12px; border: 1px solid #d3dae3; border-radius: 8px; outline: 0; color: #1f2937; background: #fff; }
    .dialog-inner input:focus { border-color: #78a889; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
    .primary { color: #1b4332; background: var(--accent); border-color: #a5d6b7; font-weight: 650; }
    @media (max-width: 600px) {
      .shell { padding: 0 15px; }
      header { height: 64px; }
      .brand small { display: none; }
      .status { display: none; }
      .intro { padding-top: 55px; }
      .hint { max-width: 60%; line-height: 1.4; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="mark">✳</div><div>DeepSeek Harness<small>多应用会话示例</small></div></div>
      <div class="header-actions">
        <span class="status" id="status">未连接</span>
        <button id="settingsButton" type="button" title="设置 API Key">设置</button>
        <button id="newChatButton" type="button">新对话</button>
      </div>
    </header>
    <main>
      <section class="intro" id="intro">
        <div class="spark">✳</div>
        <h1>今天有什么可以帮你？</h1>
        <p>通过 DeepSeek Harness 开始一段新的对话</p>
      </section>
      <section id="messages" aria-live="polite" aria-label="对话消息"></section>
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="2" placeholder="给 DeepSeek Harness 发消息…" aria-label="消息内容"></textarea>
          <div class="composer-bottom">
            <span class="hint">Enter 发送 · Shift + Enter 换行</span>
            <div>
              <button class="cancel" id="cancelButton" type="button" hidden>停止任务</button>
              <button class="send" id="sendButton" type="submit"><span>发送</span><span aria-hidden="true">↑</span></button>
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer>前端独立运行；API Key 通过 WebSocket URL 发送给 Rust 服务</footer>
  </div>

  <dialog id="settingsDialog">
    <form class="dialog-inner" id="settingsForm">
      <h2>连接设置</h2>
      <p>填写 Rust 服务的 WebSocket 地址，以及 <code>config.json</code> 顶层 <code>api_key</code>（不是 <code>llm.api_key</code>）。</p>
      <label for="backendUrl">WebSocket URL</label>
      <input id="backendUrl" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="ws://127.0.0.1:8080/api/remote.mux" required>
      <div style="height: 14px"></div>
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="例如 sk-app-a" required>
      <div class="dialog-actions">
        <button id="cancelSettings" type="button">取消</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    // MIT-licensed, dependency-free JSON-RPC client/server for the browser.
    import {
      JSONRPCClient,
      JSONRPCServer,
      JSONRPCServerAndClient
    } from 'https://esm.sh/json-rpc-2.0@1.7.1?bundle';

    (() => {
      const $ = (selector) => document.querySelector(selector);
      const form = $('#chatForm');
      const prompt = $('#prompt');
      const messages = $('#messages');
      const status = $('#status');
      const sendButton = $('#sendButton');
      const cancelButton = $('#cancelButton');
      const dialog = $('#settingsDialog');
      const apiKeyInput = $('#apiKey');
      const backendUrlInput = $('#backendUrl');
      const storage = {
        get key() { return localStorage.getItem('dsh-demo-api-key') || ''; },
        set key(value) { localStorage.setItem('dsh-demo-api-key', value); },
        get endpoint() {
          return localStorage.getItem('dsh-demo-ws-url') ||
            `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.hostname}:8080/api/remote.mux`;
        },
        set endpoint(value) { localStorage.setItem('dsh-demo-ws-url', value); },
        get session() { return localStorage.getItem('dsh-demo-session-id') || ''; },
        set session(value) { localStorage.setItem('dsh-demo-session-id', value); }
      };
      let connection = null;
      let opening = null;
      let openingSocket = null;
      let activeReply = null;
      let activeTurnId = null;
      let attachedSession = null;
      let attachmentPromise = null;
      let bufferedSessionEvents = [];
      const seenEventIds = new Set();

      function setStatus(text, ready = false) {
        status.textContent = text;
        status.classList.toggle('ready', ready);
      }

      function addMessage(role, text, meta = '') {
        $('#intro').hidden = true;
        const article = document.createElement('article');
        article.className = `message ${role}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'assistant' ? '✳' : '你';
        const body = document.createElement('div');
        body.className = 'message-body';
        const label = document.createElement('div');
        label.className = 'role';
        label.textContent = role === 'assistant' ? 'DeepSeek Harness' : role === 'error' ? '请求失败' : '你';
        const content = document.createElement('div');
        content.className = 'content';
        content.textContent = text;
        body.append(label, content);
        if (meta) {
          const detail = document.createElement('div');
          detail.className = 'meta';
          detail.textContent = meta;
          body.append(detail);
        }
        article.append(avatar, body);
        messages.append(article);
        article.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return article;
      }

      function beginAssistantReply() {
        const article = addMessage('assistant', '');
        const body = article.querySelector('.message-body');
        const content = article.querySelector('.content');
        content.hidden = true;
        const activity = document.createElement('div');
        activity.className = 'activity-list';
        const progress = document.createElement('div');
        progress.className = 'thinking';
        progress.setAttribute('aria-label', '正在处理');
        progress.innerHTML = '<i></i><i></i><i></i>';
        activity.append(progress);
        body.insertBefore(activity, content);
        return { article, body, content, activity, progress, text: '', tools: new Map() };
      }

      function eventCursorKey() { return `dsh-demo-event-cursor:${storage.session}`; }
      function activeTurnKey() { return `dsh-demo-active-turn:${storage.session}`; }
      function completedTurnsKey() { return `dsh-demo-completed-turns:${storage.session}`; }
      function completedTurnIds() {
        try { return new Set(JSON.parse(localStorage.getItem(completedTurnsKey()) || '[]')); }
        catch (_) { return new Set(); }
      }
      function saveTurnOutcome(turnId, role, text, meta) {
        const ids = completedTurnIds();
        if (ids.has(turnId)) return false;
        ids.add(turnId);
        localStorage.setItem(completedTurnsKey(), JSON.stringify([...ids].slice(-100)));
        if (text) saveMessage(role, text, meta);
        return true;
      }
      function updateCancelButton() {
        cancelButton.hidden = !activeTurnId;
        cancelButton.disabled = !activeTurnId;
      }

      function stopProgress(reply) {
        reply.progress?.remove();
        reply.progress = null;
      }

      function appendEventText(node, text) {
        const chunk = document.createElement('div');
        chunk.className = 'event-body';
        chunk.textContent = text;
        node.append(chunk);
      }

      function handleSessionEvent(params) {
        const sessionEvent = params;
        if (sessionEvent?.payload?.session_id !== storage.session) return;
        if (sessionEvent.event_id) {
          if (seenEventIds.has(sessionEvent.event_id)) return;
          seenEventIds.add(sessionEvent.event_id);
        }
        const event = sessionEvent.payload?.event;
        if (!event || typeof event !== 'object') return;
        const turnId = sessionEvent.payload?.turn_id;

        if (event.type === 'turn_status') {
          if (event.status === 'started') {
            activeTurnId = turnId;
            localStorage.setItem(activeTurnKey(), turnId);
            if (!activeReply) activeReply = beginAssistantReply();
            activeReply.turnId = turnId;
            setStatus('任务正在后台运行…', true);
            updateCancelButton();
          } else if (event.status === 'completed') {
            const answer = String(event.answer || '');
            const displayedAnswer = answer || '任务已完成，但没有返回文本。';
            const meta = '自然结束';
            if (activeReply?.turnId === turnId) {
              finishAssistantReply(activeReply, displayedAnswer, meta);
              activeReply.terminalStatus = 'completed';
              activeReply = null;
            } else if (!completedTurnIds().has(turnId)) {
              addMessage('assistant', displayedAnswer, meta);
            }
            saveTurnOutcome(turnId, 'assistant', displayedAnswer, meta);
            activeTurnId = null;
            localStorage.removeItem(activeTurnKey());
            setStatus('任务自然结束', true);
            updateCancelButton();
          } else if (event.status === 'cancelled') {
            if (activeReply?.turnId === turnId) {
              finishAssistantReply(activeReply, activeReply.text, '已取消');
              activeReply.terminalStatus = 'cancelled';
              saveTurnOutcome(turnId, 'assistant', activeReply.text || '任务已取消。', '已取消');
              activeReply = null;
            } else if (!completedTurnIds().has(turnId)) {
              addMessage('assistant', '任务已取消。', '已取消');
              saveTurnOutcome(turnId, 'assistant', '任务已取消。', '已取消');
            }
            activeTurnId = null;
            localStorage.removeItem(activeTurnKey());
            setStatus('任务已取消');
            updateCancelButton();
          } else if (event.status === 'failed') {
            const message = String(event.message || '任务执行失败');
            if (activeReply?.turnId === turnId) {
              stopProgress(activeReply);
              activeReply.terminalStatus = 'failed';
              activeReply = null;
            }
            addMessage('error', message);
            activeTurnId = null;
            localStorage.removeItem(activeTurnKey());
            setStatus('任务失败');
            updateCancelButton();
          }
          if (sessionEvent.event_id) localStorage.setItem(eventCursorKey(), sessionEvent.event_id);
          return;
        }
        if (!activeReply) {
          if (sessionEvent.event_id) localStorage.setItem(eventCursorKey(), sessionEvent.event_id);
          return;
        }

        switch (event.type) {
          case 'thinking': {
            stopProgress(activeReply);
            let card = activeReply.activity.querySelector('.reasoning-card');
            if (!card) {
              card = document.createElement('details');
              card.className = 'reasoning-card';
              const summary = document.createElement('summary');
              summary.textContent = '思考过程';
              card.append(summary);
              activeReply.activity.append(card);
            }
            appendEventText(card, String(event.text || ''));
            setStatus('正在思考…', true);
            break;
          }
          case 'text':
            stopProgress(activeReply);
            activeReply.text += String(event.text || '');
            activeReply.content.hidden = false;
            activeReply.content.textContent = activeReply.text;
            setStatus('正在生成回复…', true);
            break;
          case 'tool_call': {
            stopProgress(activeReply);
            const id = String(event.callId || `tool-${activeReply.tools.size}`);
            const card = document.createElement('details');
            card.className = 'tool-card';
            const summary = document.createElement('summary');
            const toolName = String(event.tool || 'tool');
            summary.textContent = `调用工具：${toolName} · 运行中`;
            const state = document.createElement('div');
            state.className = 'event-body tool-state';
            state.textContent = '正在执行';
            card.append(summary);
            if (event.input !== undefined) {
              appendEventText(card, typeof event.input === 'string'
                ? event.input
                : JSON.stringify(event.input, null, 2));
            }
            card.append(state);
            activeReply.activity.append(card);
            const queue = activeReply.tools.get(id) || [];
            queue.push({ summary, state });
            activeReply.tools.set(id, queue);
            setStatus(`正在调用 ${toolName}…`, true);
            break;
          }
          case 'tool_result': {
            const id = String(event.callId || '');
            const queue = activeReply.tools.get(id) || [];
            const call = queue.shift();
            if (queue.length) activeReply.tools.set(id, queue);
            else activeReply.tools.delete(id);
            if (call) {
              const failed = event.status === 'error';
              call.summary.textContent = `${call.summary.textContent.replace(/ · 运行中$/, '')} · ${failed ? '失败' : '完成'}`;
              call.state.classList.toggle('error', failed);
              call.state.textContent = failed ? '工具返回错误' : '执行完成';
              if (event.result) appendEventText(call.state.parentElement, String(event.result));
              if (event.error) appendEventText(call.state.parentElement, JSON.stringify(event.error, null, 2));
            }
            setStatus('继续处理…', true);
            break;
          }
          case 'status':
            if (event.phase === 'step_start') setStatus(`执行步骤 ${event.step ?? ''}…`, true);
            else if (event.phase === 'turn_start') setStatus('开始处理…', true);
            break;
          case 'final':
            if (typeof event.text === 'string') {
              activeReply.text = event.text;
              activeReply.content.hidden = !event.text;
              activeReply.content.textContent = event.text;
            }
            break;
          default:
            break;
        }
        if (sessionEvent.event_id) localStorage.setItem(eventCursorKey(), sessionEvent.event_id);
      }

      function finishAssistantReply(reply, answer, meta) {
        stopProgress(reply);
        if (answer) {
          reply.content.hidden = false;
          reply.content.textContent = answer;
        }
        if (meta) {
          const detail = document.createElement('div');
          detail.className = 'meta';
          detail.textContent = meta;
          reply.body.append(detail);
        }
      }

      function transcriptKey() {
        return `dsh-demo-transcript:${storage.session}`;
      }
      function saveMessage(role, text, meta = '') {
        let items = [];
        try { items = JSON.parse(localStorage.getItem(transcriptKey()) || '[]'); } catch (_) {}
        items.push({ role, text, meta });
        localStorage.setItem(transcriptKey(), JSON.stringify(items.slice(-100)));
      }
      function restoreTranscript() {
        let items = [];
        try { items = JSON.parse(localStorage.getItem(transcriptKey()) || '[]'); } catch (_) {}
        for (const item of items) addMessage(item.role, item.text, item.meta || '');
      }

      function websocketUrl() {
        if (!storage.session) storage.session = crypto.randomUUID();
        const url = new URL(storage.endpoint);
        if (url.protocol !== 'ws:' && url.protocol !== 'wss:') {
          throw new Error('WebSocket URL 必须以 ws:// 或 wss:// 开头');
        }
        url.searchParams.set('api_key', storage.key);
        url.searchParams.set('session_id', storage.session);
        return url.toString();
      }

      function connect() {
        if (connection?.socket.readyState === WebSocket.OPEN) return Promise.resolve(connection);
        if (opening) return opening;
        if (!storage.key) throw new Error('请先设置应用 API Key');

        const socket = new WebSocket(websocketUrl());
        const client = new JSONRPCClient((request) => {
          if (socket.readyState !== WebSocket.OPEN) {
            return Promise.reject(new Error('WebSocket 尚未连接'));
          }
          socket.send(JSON.stringify(request));
        });
        const server = new JSONRPCServer({
          errorListener: (message, error) => console.warn(message, error)
        });
        const rpc = new JSONRPCServerAndClient(server, client);
        rpc.addMethod('session.event', (params) => {
          if (attachmentPromise) bufferedSessionEvents.push(params);
          else handleSessionEvent(params);
        });
        rpc.addMethod('session.closed', () => {});

        socket.addEventListener('message', (event) => {
          try {
            const message = JSON.parse(event.data);
            void rpc.receiveAndSend(message).catch((error) => {
              console.warn('JSON-RPC message error:', error);
            });
          } catch (error) {
            console.warn('Invalid JSON-RPC message:', error);
          }
        });
        socket.addEventListener('close', (event) => {
          rpc.rejectAllPendingRequests(`WebSocket closed (${event.code})`);
          if (connection?.socket === socket) {
            connection = null;
            setStatus('连接已断开');
          }
        });

        openingSocket = socket;
        const attempt = new Promise((resolve, reject) => {
          socket.addEventListener('open', () => {
            connection = { socket, rpc };
            setStatus('已连接', true);
            resolve(connection);
          }, { once: true });
          socket.addEventListener('error', () => {
            setStatus('WebSocket 握手失败；请检查服务地址和应用 API Key');
          }, { once: true });
          socket.addEventListener('close', (event) => {
            reject(new Error(
              `WebSocket 连接失败 (${event.code})。请确认后端可访问，并使用 config.json 顶层 api_key。`
            ));
          }, { once: true });
        });
        opening = attempt;
        attempt.then(() => {
          if (opening === attempt) {
            opening = null;
            openingSocket = null;
          }
        }, () => {
          if (opening === attempt) {
            opening = null;
            openingSocket = null;
          }
          if (socket.readyState < WebSocket.CLOSING) socket.close();
        });
        return opening;
      }

      async function closeConnection() {
        const current = connection;
        const pendingSocket = openingSocket;
        connection = null;
        opening = null;
        openingSocket = null;
        if (current) {
          current.rpc.rejectAllPendingRequests('WebSocket connection reset');
          current.socket.close();
        } else if (pendingSocket && pendingSocket.readyState < WebSocket.CLOSING) {
          pendingSocket.close();
        }
        attachedSession = null;
      }

      async function ensureAttached() {
        const client = await connect();
        if (attachedSession === storage.session) return client;
        if (attachmentPromise) {
          await attachmentPromise;
          return client;
        }
        const sessionId = storage.session;
        const cursor = localStorage.getItem(eventCursorKey());
        attachmentPromise = (async () => {
          const result = await client.rpc.request('session.attachment', {
            after_event_id: cursor || null
          });
          const events = result?.events || [];
          let replay = events;
          if (!cursor) {
            const lastStatus = [...events].reverse().find((item) =>
              item?.payload?.event?.type === 'turn_status'
            );
            if (lastStatus?.payload?.event?.status === 'started') {
              const activeId = lastStatus.payload.turn_id;
              replay = events.filter((item) => item?.payload?.turn_id === activeId);
            } else {
              const completed = completedTurnIds();
              replay = events.filter((item) => {
                const itemEvent = item?.payload?.event;
                return itemEvent?.type === 'turn_status' &&
                  ['completed', 'cancelled', 'failed'].includes(itemEvent.status) &&
                  !completed.has(item?.payload?.turn_id);
              });
            }
          } else {
            activeTurnId = localStorage.getItem(activeTurnKey());
            if (activeTurnId && !activeReply) {
              activeReply = beginAssistantReply();
              activeReply.turnId = activeTurnId;
            }
          }
          for (const item of replay) handleSessionEvent(item);
          if (!cursor) {
            const lastEvent = events.at(-1);
            if (lastEvent?.event_id) localStorage.setItem(eventCursorKey(), lastEvent.event_id);
          }
          const buffered = bufferedSessionEvents;
          bufferedSessionEvents = [];
          for (const item of buffered) handleSessionEvent(item);
          attachedSession = sessionId;
        })();
        try {
          await attachmentPromise;
          return client;
        } finally {
          attachmentPromise = null;
        }
      }

      function forgetLocalSession() {
        const oldSession = storage.session;
        if (oldSession) {
          localStorage.removeItem(`dsh-demo-transcript:${oldSession}`);
          localStorage.removeItem(`dsh-demo-event-cursor:${oldSession}`);
          localStorage.removeItem(`dsh-demo-active-turn:${oldSession}`);
          localStorage.removeItem(`dsh-demo-completed-turns:${oldSession}`);
        }
        storage.session = '';
        messages.replaceChildren();
        $('#intro').hidden = false;
        activeReply = null;
        activeTurnId = null;
        attachedSession = null;
        updateCancelButton();
      }

      async function resetSession() {
        const oldSession = storage.session;
        setStatus('正在清理当前 session…');
        if (storage.key && oldSession) {
          const client = await connect();
          await client.rpc.request('session.close', {});
        }
        await closeConnection();
        forgetLocalSession();
      }

      $('#settingsButton').addEventListener('click', () => {
        apiKeyInput.value = storage.key;
        backendUrlInput.value = storage.endpoint;
        dialog.showModal();
        backendUrlInput.focus();
      });
      $('#cancelSettings').addEventListener('click', () => dialog.close());
      $('#settingsForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const nextKey = apiKeyInput.value.trim();
        const nextEndpoint = backendUrlInput.value.trim();
        if (!/^wss?:\/\/[^\s/]+(?:\/[^\s]*)?$/i.test(nextEndpoint)) {
          backendUrlInput.setCustomValidity('请输入有效的 WebSocket URL，例如 ws://localhost:8080/api/remote.mux');
          backendUrlInput.reportValidity();
          return;
        }
        backendUrlInput.setCustomValidity('');
        let oldSessionCleanupFailed = false;
        if (nextKey !== storage.key || nextEndpoint !== storage.endpoint) {
          try {
            await resetSession();
          } catch (error) {
            oldSessionCleanupFailed = true;
            console.warn('Could not clean up the previous session while saving new settings:', error);
            await closeConnection();
            forgetLocalSession();
          }
        }
        storage.key = nextKey;
        storage.endpoint = nextEndpoint;
        dialog.close();
        setStatus(
          oldSessionCleanupFailed ? '设置已保存；旧会话未清理' : 'API Key 已保存',
          true
        );
        prompt.focus();
      });
      $('#newChatButton').addEventListener('click', async () => {
        try {
          await resetSession();
          await ensureAttached();
          setStatus('新对话', true);
          prompt.focus();
        } catch (error) {
          addMessage('error', `新对话失败：${error instanceof Error ? error.message : String(error)}`);
          setStatus('新对话失败');
        }
      });

      cancelButton.addEventListener('click', async () => {
        if (!activeTurnId) return;
        const turnId = activeTurnId;
        cancelButton.disabled = true;
        cancelButton.textContent = '正在停止…';
        try {
          const client = await ensureAttached();
          const result = await client.rpc.request('session.cancel', { turn_id: turnId });
          if (!result?.accepted) setStatus('任务已结束', true);
          else setStatus('已请求停止任务…', true);
        } catch (error) {
          addMessage('error', `停止任务失败：${error instanceof Error ? error.message : String(error)}`);
          setStatus('停止任务失败');
        } finally {
          cancelButton.textContent = '停止任务';
          updateCancelButton();
        }
      });

      prompt.addEventListener('input', () => {
        prompt.style.height = 'auto';
        prompt.style.height = `${Math.min(prompt.scrollHeight, 190)}px`;
      });
      prompt.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text) return;
        if (activeTurnId) {
          setStatus('当前任务仍在运行；请等待完成或停止任务');
          return;
        }
        if (!storage.key) {
          $('#settingsButton').click();
          return;
        }

        addMessage('user', text);
        saveMessage('user', text);
        prompt.value = '';
        prompt.style.height = 'auto';
        sendButton.disabled = true;
        setStatus('正在连接…');
        const reply = beginAssistantReply();
        activeReply = reply;

        try {
          const client = await ensureAttached();
          const result = await client.rpc.request('session.prompt', { prompt: text });
          if (result.cancelled) {
            if (reply.terminalStatus !== 'cancelled') {
              finishAssistantReply(reply, reply.text, '已取消');
              saveTurnOutcome(result.turn_id || reply.turnId, 'assistant', reply.text || '任务已取消。', '已取消');
            }
            activeTurnId = null;
            localStorage.removeItem(activeTurnKey());
            activeReply = null;
            setStatus('任务已取消');
          } else {
            const answer = result.answer || '任务已完成，但没有返回文本。';
            if (reply.terminalStatus !== 'completed') {
              finishAssistantReply(reply, answer, '自然结束');
              saveTurnOutcome(result.turn_id || reply.turnId, 'assistant', answer, '自然结束');
            }
            activeReply = null;
            activeTurnId = null;
            localStorage.removeItem(activeTurnKey());
            setStatus('任务自然结束', true);
          }
          updateCancelButton();
        } catch (error) {
          if (activeReply === reply) activeReply = null;
          stopProgress(reply);
          if (activeTurnId) {
            addMessage('assistant', '客户端连接已断开；任务仍在后台运行，重新连接后可查看结果。');
            setStatus('客户端已断开；任务仍在后台运行');
          } else {
            addMessage('error', error instanceof Error ? error.message : String(error));
            setStatus('请求失败');
          }
        } finally {
          sendButton.disabled = false;
          prompt.focus();
        }
      });

      if (storage.key) {
        setStatus('API Key 已配置', true);
        if (!storage.session) storage.session = crypto.randomUUID();
        activeTurnId = localStorage.getItem(activeTurnKey());
        updateCancelButton();
        restoreTranscript();
        void ensureAttached().catch((error) => {
          setStatus(`连接失败：${error instanceof Error ? error.message : String(error)}`);
        });
      }
    })();
  </script>
</body>
</html>
