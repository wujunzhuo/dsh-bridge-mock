[package]
name = "dsh-bridge-mock"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.0", features = ["full", "process", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
arc-swap = "1.0"
async-trait = "0.1"
libc = "0.2"
